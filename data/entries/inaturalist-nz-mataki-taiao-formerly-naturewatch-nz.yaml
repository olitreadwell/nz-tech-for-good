name: iNaturalist NZ – Mātaki Taiao (formerly NatureWatch NZ)
domain: environmental citizen-science
what: iNaturalist NZ – Mātaki Taiao, run by the New Zealand Bio-Recording Network Trust, is a website
  and app where anyone can record sightings of plants, animals, and fungi, helping scientists track new
  and spreading species across the country; it started in 2006 as NatureWatch NZ and rebranded in 2018.
