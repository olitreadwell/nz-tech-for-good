name: Karo
domain: health tech for good / hauora Māori
what: Karo is a Māori-owned tech company that builds digital tools for primary and community health providers
  and social services, including Te Pokapū (a claims and decision support system), Kotahi (client and case
  management for NGOs and community organisations), and Māramatanga (data insights and reporting), used
  across most of the primary care sector.
