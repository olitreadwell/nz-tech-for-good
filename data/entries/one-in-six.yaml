name: One in Six
domain: disability employment tech
what: One in Six is a disability employment hub built by the New Zealand Disability Employers' Network
  and Whaikaha, the Ministry of Disabled People, giving employers free tools, guidance, and the ARM-Up
  accessible recruitment model to hire and support disabled staff. It launched in February 2026, and
  takes its name from the one in six New Zealanders who are disabled.
