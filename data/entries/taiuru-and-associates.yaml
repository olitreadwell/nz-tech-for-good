what: "Taiuru & Associates is a New Zealand boutique consultancy led by Dr Karaitiana Taiuru specialising in Māori data sovereignty, AI governance, and responsible emerging technology. It advises iwi, government agencies, and private organisations on navigating the intersection of tikanga Māori and digital systems — producing widely cited frameworks, Te Tiriti-based AI ethical principles, and policy guidance to protect Māori rights in the data and AI age."
