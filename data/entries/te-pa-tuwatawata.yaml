name: Te Pā Tūwatawata
domain: Māori data sovereignty / indigenous data
what: Te Pā Tūwatawata is Aotearoa's first decentralised, Māori-owned data storage network, letting marae,
  hapū, iwi, and other Māori organisations store their data on New Zealand-owned infrastructure under their
  own tikanga rather than on foreign-owned cloud servers.
