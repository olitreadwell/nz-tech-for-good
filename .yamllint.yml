extends: default

rules:
  line-length:
    max: 200
  document-start: disable
  truthy:
    disable
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1
  indentation:
    spaces: 2
    # The dependency-batching automation rewrites dependabot.yml with
    # zero-indent sequences in the repos it runs in. Accept both styles
    # so a batch does not turn the lint gate red.
    indent-sequences: whatever
  comments:
    min-spaces-from-content: 1
