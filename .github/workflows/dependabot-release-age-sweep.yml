name: Dependabot release-age sweep

# A Dependabot PR whose releases were younger than MIN_AGE_DAYS when it opened
# never gets auto-merge from the open event alone. This daily sweep re-checks
# every open Dependabot PR so those mature into auto-merge on their own.
on:
  schedule:
    # 15:00 UTC is 04:00 Pacific/Auckland during NZDT (and 03:00 during NZST),
    # which keeps the sweep inside the quiet window.
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-release-age-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Enable auto-merge for matured updates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Sweep open Dependabot PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIN_AGE_DAYS: 3
          REQUIRE_GREEN_CHECKS: 'true'
        run: |
          for url in $(gh pr list --state open --app dependabot --json url -q '.[].url'); do
            node scripts/dependabot-auto-merge.mjs "$url" || echo "sweep: error on $url"
          done
