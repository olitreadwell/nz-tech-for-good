name: Dependabot release-age sweep

# Re-checks open Dependabot PRs daily: a PR whose releases were younger than
# MIN_AGE_DAYS at open time gets auto-merge enabled once the releases mature.
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sweep:
    name: Enable auto-merge for matured updates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sweep open Dependabot PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIN_AGE_DAYS: 3
        run: |
          for url in $(gh pr list --state open --app dependabot --json url -q '.[].url'); do
            node scripts/dependabot-auto-merge.mjs "$url" || echo "sweep: error on $url"
          done
