name: Weekly link check

# Runs scripts/linkcheck.py once a week against every entry's links.
# If it finds genuinely dead links (404, DNS failure, refused connection),
# it opens a single tracking issue and keeps it updated. Bot-blocked links
# (403 / 999, common for LinkedIn) are NOT treated as failures. When the
# links recover, the issue is closed automatically.

on:
  schedule:
    # Sundays 19:00 UTC — Monday morning in New Zealand.
    - cron: "0 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  linkcheck:
    name: Check entry links
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # Bump this to update lychee. Dependabot does not track this pinned URL.
      LYCHEE_VERSION: "v0.24.2"
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install lychee
        run: |
          set -euo pipefail
          url="https://github.com/lycheeverse/lychee/releases/download/lychee-${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "$url" -o lychee.tar.gz
          tar -xzf lychee.tar.gz
          sudo mv lychee /usr/local/bin/lychee
          lychee --version

      - name: Run link check
        id: check
        run: |
          set +e
          python3 scripts/linkcheck.py | tee linkcheck-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Open or update issue on dead links
        if: steps.check.outputs.exit_code != '0'
        run: |
          set -euo pipefail
          gh label create link-check \
            --color FBCA04 \
            --description "Automated dead-link report" 2>/dev/null || true
          {
            echo "The weekly link check found one or more genuinely dead links in \`data/entries/\`."
            echo ""
            echo "Bot-blocked responses (403 / 999, common for LinkedIn) are not counted here — only 404s, DNS failures, and refused connections."
            echo ""
            echo "Reproduce locally:"
            echo ""
            echo '```'
            echo "pip install -r requirements.txt"
            echo "python3 scripts/linkcheck.py"
            echo '```'
            echo ""
            echo "Latest report (run ${{ github.run_id }}, $(date -u +%Y-%m-%dT%H:%MZ)):"
            echo ""
            echo '```'
            cat linkcheck-output.txt
            echo '```'
          } > issue-body.md

          existing=$(gh issue list --label link-check --state open --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "${existing:-}" ]; then
            gh issue edit "$existing" --body-file issue-body.md
            gh issue comment "$existing" --body "Re-checked on $(date -u +%Y-%m-%d) — dead links still present. Report in the issue body above (run ${{ github.run_id }})."
          else
            gh issue create \
              --title "Dead links found in directory entries" \
              --label link-check \
              --body-file issue-body.md
          fi

      - name: Close issue when links recover
        if: steps.check.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          existing=$(gh issue list --label link-check --state open --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "${existing:-}" ]; then
            gh issue comment "$existing" --body "Link check passed on $(date -u +%Y-%m-%d) — no dead links remain. Closing automatically."
            gh issue close "$existing"
          fi
