name: Dependabot auto-merge

# pull_request_target runs with the secrets of the base branch, so Dependabot
# pull requests can get auto-merge. The checkout below is the base branch.
# The only untrusted input is the pull request body. The script reads it as
# text. No pull request code ever runs here.
on:
  pull_request_target:
    # The edited, labeled, and unlabeled events each re-ran the whole
    # workflow. Dependabot labels its own pull requests on open, so every pull
    # request triggered it three or four times. The synchronize event is kept.
    # A fresh push can change the verdict.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  # The script re-reads pull request state on every run. A newer event can safely
  # replace a queued one instead of stacking behind it.
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Auto-merge safe updates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.actor == 'dependabot[bot]' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      - name: Gate on update type, release age, and check status
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIN_AGE_DAYS: 3
          REQUIRE_GREEN_CHECKS: 'true'
        run: node scripts/dependabot-auto-merge.mjs "$PR_URL"
