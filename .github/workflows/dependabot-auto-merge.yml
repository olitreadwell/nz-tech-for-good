name: Dependabot auto-merge

# pull_request_target runs with the base branch's secrets so Dependabot PRs can
# be given auto-merge. The checkout below is the base branch, and the only
# untrusted input is the PR body, which scripts/dependabot-auto-merge.mjs reads
# as text, so no PR code ever executes here.
on:
  pull_request_target:
    # edited, labeled and unlabeled each re-ran the whole workflow, and
    # dependabot labels its own PRs on open, so every PR triggered it three or
    # four times. synchronize is kept: a fresh push can change the verdict.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  # The script re-reads PR state on every run, so a newer event can safely
  # replace a queued one instead of stacking behind it.
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Auto-merge safe updates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.actor == 'dependabot[bot]' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      - name: Gate on update type, release age, and check status
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIN_AGE_DAYS: 3
          REQUIRE_GREEN_CHECKS: 'true'
        run: node scripts/dependabot-auto-merge.mjs "$PR_URL"
