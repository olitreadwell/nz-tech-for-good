name: contributor-gate

# Reputation gate for pull requests. Scores the PR author from public
# GitHub signals using the pr-vetting action. New or unknown accounts
# get a failing check until they meet the policy, or a maintainer adds
# the vetted-contributor label after a manual review.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled]
    branches: [main]

permissions:
  pull-requests: write
  issues: write

jobs:
  gate:
    name: Contributor gate
    runs-on: ubuntu-latest
    steps:
      - uses: olitreadwell/pr-vetting@v0.3.3-beta.1
        id: vet
        with:
          pr-number: ${{ github.event.pull_request.number }}
          login: ${{ github.event.pull_request.user.login }}
          allowlist: "olitreadwell,dependabot[bot]"
          min-account-age-days: 90
          min-in-repo-merged-prs: 1
