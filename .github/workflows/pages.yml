name: Pages redirect

# The site now lives at https://nz-tech-for-good.vercel.app/.
# This workflow keeps old GitHub Pages links working by publishing a small
# redirect page instead of the old nested build.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy redirect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: touch .github/pages-redirect/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .github/pages-redirect
      - id: deployment
        uses: actions/deploy-pages@v5
