name: Data quality

# Weekly freshness and coverage sweep for data/entries/*.yaml.
#
# Runs scripts/dataquality.py (duplicates are fatal, freshness and slug
# mismatches are non-fatal warnings) and scripts/coverage.py (per-domain
# and per-region counts). While any entry's last_verified is missing or
# older than 183 days (~6 months), a tracking issue is opened on first
# sight and updated every run; once everything is fresh the issue is
# closed. The job is non-blocking by design - stale data never fails the
# run, it just lands in the tracking issue and the job summary.
on:
  schedule:
    - cron: "0 6 * * 2"  # weekly, Tuesday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sweep:
    name: Freshness + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run data-quality and coverage checks
        run: |
          set +e
          python3 scripts/dataquality.py > dataquality.log
          echo "dataquality_exit=$?" >> "$GITHUB_ENV"
          set -e
          cat dataquality.log
          python3 scripts/coverage.py > coverage.log
          cat coverage.log

      - name: Refresh stale-entries tracking issue
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys

          REPO = os.environ["GITHUB_REPOSITORY"]
          RUN_ID = os.environ["GITHUB_RUN_ID"]
          RUN_URL = f"https://github.com/{REPO}/actions/runs/{RUN_ID}"
          TITLE = "Stale directory entries (data-quality check)"
          WINDOW = "6 months (183 days)"


          def sh(*args, input=None):
              return subprocess.run(args, input=input, capture_output=True, text=True)


          def find_tracking_issue():
              res = sh(
                  "gh", "issue", "list", "--search",
                  'in:title "Stale directory entries"',
                  "--json", "number,state", "--limit", "1",
              )
              if res.returncode != 0 or not res.stdout.strip():
                  return None
              rows = json.loads(res.stdout)
              return rows[0] if rows else None


          def main():
              dq_log = pathlib.Path("dataquality.log").read_text()
              cov_log = pathlib.Path("coverage.log").read_text()

              stale = []
              in_freshness = False
              for line in dq_log.splitlines():
                  if "entries older than" in line:
                      in_freshness = True
                      continue
                  if in_freshness and line.startswith("== "):
                      break
                  if in_freshness:
                      m = re.match(r"^\s*-\s+(\S+)\s+(\S+\.yaml)\s+\((.*)\)\s*$", line)
                      if m:
                          when, filename, name = m.groups()
                          stale.append(f"- `{when}` — `{filename}` ({name})")

              now = dt.datetime.now(dt.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
              if stale:
                  noun = "entry" if len(stale) == 1 else "entries"
                  head = (
                      f"Last checked: **{now}** ([workflow run]({RUN_URL}))\n\n"
                      f"{len(stale)} {noun} have a missing or stale `last_verified` "
                      f"(older than {WINDOW}):\n\n"
                  )
                  items = "\n".join(stale) + "\n"
              else:
                  head = (
                      f"Last checked: **{now}** ([workflow run]({RUN_URL}))\n\n"
                      f"All entries were verified within the last {WINDOW}.\n"
                  )
                  items = ""
              body = (
                  head + items + "\n"
                  "<details>\n<summary>dataquality.py output</summary>\n\n"
                  "```text\n" + dq_log + "```\n</details>\n\n"
                  "<details>\n<summary>coverage.py output</summary>\n\n"
                  "```text\n" + cov_log + "```\n</details>\n"
              )

              issue = find_tracking_issue()
              if stale:
                  if issue:
                      res = sh(
                          "gh", "issue", "edit", str(issue["number"]),
                          "--title", TITLE, "--state", "open", "--body-file", "-",
                          input=body,
                      )
                      if res.returncode != 0:
                          raise RuntimeError(f"gh issue edit failed: {res.stderr.strip()}")
                      print(f"Updated tracking issue #{issue['number']} ({len(stale)} stale entries)")
                  else:
                      res = sh("gh", "issue", "create", "--title", TITLE, "--body-file", "-", input=body)
                      if res.returncode != 0:
                          raise RuntimeError(f"gh issue create failed: {res.stderr.strip()}")
                      print(f"Opened tracking issue: {res.stdout.strip()}")
              else:
                  if issue:
                      if issue["state"] == "OPEN":
                          res = sh(
                              "gh", "issue", "close", str(issue["number"]),
                              "--comment", f"No stale entries as of {now} — closing.",
                          )
                          if res.returncode != 0:
                              raise RuntimeError(f"gh issue close failed: {res.stderr.strip()}")
                          print(f"Closed tracking issue #{issue['number']} (no stale entries)")
                      else:
                          print(f"Tracking issue #{issue['number']} already closed; leaving as-is")
                  else:
                      print("No stale entries and no tracking issue to close")

              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a") as f:
                      f.write("### Data-quality sweep\n\n")
                      f.write(f"- Stale entries: {len(stale)}\n")
                      f.write(f"- dataquality.py exit: {os.environ.get('dataquality_exit', 'n/a')}\n")
                      f.write("- Tracking issue: " + ("open" if stale else "none (all fresh)") + "\n")
                      f.write("\n```text\n" + dq_log + "```\n\n")
                      f.write("```text\n" + cov_log + "```\n")


          try:
              main()
          except Exception as exc:  # non-blocking: never fail the scheduled run
              print(f"::error::tracking-issue sync failed (non-blocking): {exc}")
          sys.exit(0)
          PY
