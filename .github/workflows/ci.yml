name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Validate entries and guide
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate entries against schema
        run: python3 scripts/validate.py

      - name: Regenerate GUIDE.md
        run: python3 scripts/build_guide.py

      - name: Fail if GUIDE.md is out of date
        run: |
          if ! git diff --exit-code GUIDE.md; then
            echo ""
            echo "GUIDE.md is out of date. Run 'python3 scripts/build_guide.py' locally and commit the result."
            exit 1
          fi

      - name: Regenerate entry-count badge
        run: python3 scripts/badge_entry_count.py

      - name: Fail if entry-count badge is out of date
        run: |
          if ! git diff --exit-code .github/badges/entry-count.json; then
            echo ""
            echo "The entry-count badge is out of date. Run 'python3 scripts/badge_entry_count.py' locally and commit the result."
            exit 1
          fi

      - name: Check links (non-blocking)
        continue-on-error: true
        run: python3 scripts/linkcheck.py
