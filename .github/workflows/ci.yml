name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Validate entries and guide
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run the scripts/ test suite (95% coverage gate)
        run: pytest --cov=scripts --cov-report=term-missing --cov-fail-under=95

      - name: Validate entries against schema
        run: python3 scripts/validate.py

      - name: Data-quality checks (duplicates fatal, freshness/slug warnings non-fatal)
        run: python3 scripts/dataquality.py

      - name: Coverage report (domains/regions, non-blocking)
        run: |
          {
            echo "## Coverage report"
            echo '```'
            python3 scripts/coverage.py
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Regenerate GUIDE.md
        run: python3 scripts/build_guide.py

      - name: Fail if GUIDE.md is out of date
        run: |
          if ! git diff --exit-code GUIDE.md; then
            echo ""
            echo "GUIDE.md is out of date. Run 'python3 scripts/build_guide.py' locally and commit the result."
            exit 1
          fi

      - name: Style check (em dashes, banned words)
        run: python3 scripts/stylecheck.py

      - name: Lint YAML entries (non-blocking)
        continue-on-error: true
        run: yamllint data/entries/

      - name: Spell check docs (non-blocking)
        continue-on-error: true
        run: codespell docs/ GUIDE.md README.md CONTRIBUTING.md

      - name: Regenerate data exports
        run: python3 scripts/export.py

      - name: Fail if data/exports is out of date
        run: |
          if ! git diff --exit-code data/exports; then
            echo ""
            echo "data/exports is out of date. Run 'python3 scripts/export.py' locally and commit the result."
            exit 1
          fi

      - name: Check links (non-blocking)
        continue-on-error: true
        run: python3 scripts/linkcheck.py | tee linkcheck-output.txt

      - name: Link-check summary
        if: always()
        run: |
          {
            echo "## Link check"
            echo '```'
            cat linkcheck-output.txt 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  site-tests:
    name: Site tests (Vitest + Playwright-BDD)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build the site
        working-directory: site
        run: npm run build

      - name: Unit tests, with a 95% coverage gate on site/src/lib
        working-directory: site
        run: npm run test:unit

      - name: Install Playwright's Chromium browser
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: End-to-end and accessibility tests (Playwright-BDD)
        working-directory: site
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: site/playwright-report/
          retention-days: 7
