name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Validate entries and guide
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate entries against schema
        run: python3 scripts/validate.py

      - name: Data-quality checks (duplicates fatal, freshness/slug warnings non-fatal)
        run: python3 scripts/dataquality.py

      - name: Regenerate GUIDE.md
        run: python3 scripts/build_guide.py

      - name: Fail if GUIDE.md is out of date
        run: |
          if ! git diff --exit-code GUIDE.md; then
            echo ""
            echo "GUIDE.md is out of date. Run 'python3 scripts/build_guide.py' locally and commit the result."
            exit 1
          fi

      - name: Style check (em dashes, banned words)
        run: python3 scripts/stylecheck.py

      - name: Regenerate data exports
        run: python3 scripts/export.py

      - name: Fail if data/exports is out of date
        run: |
          if ! git diff --exit-code data/exports; then
            echo ""
            echo "data/exports is out of date. Run 'python3 scripts/export.py' locally and commit the result."
            exit 1
          fi

      - name: Check links (non-blocking)
        continue-on-error: true
        run: python3 scripts/linkcheck.py

  site-tests:
    name: Site tests (Vitest + Playwright-BDD)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build the site
        working-directory: site
        run: npm run build

      - name: Unit tests, with a 95% coverage gate on site/src/lib
        working-directory: site
        run: npm run test:unit

      - name: Install Playwright's Chromium browser
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: End-to-end and accessibility tests (Playwright-BDD)
        working-directory: site
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: site/playwright-report/
          retention-days: 7
