name: Auto-merge eligible Dependabot PRs

# Runs daily. Merges Dependabot PRs that are all of:
#   - labelled "automerge" (patch/minor only, set by dependabot-label.yml)
#   - at least 3 days old (gives a window to notice and object)
#   - not labelled "on-hold" (add this label to any PR to block it)
#   - passing every status check
#   - not have a review requesting changes
#
# Major version bumps are never labelled "automerge" in the first place, so
# they always wait for a human, however long that takes.
#
# To stop this from merging a specific update: add the "on-hold" label to
# its PR, or leave a "request changes" review. To pause it for everything,
# disable this workflow in the Actions tab.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  pull-requests: write
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Merge eligible PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          three_days_ago=$(date -u -d "-3 days" +%s 2>/dev/null || date -u -v-3d +%s)

          prs=$(gh pr list --repo "$REPO" --author "dependabot[bot]" \
            --label automerge --state open --json number,createdAt,labels)

          echo "$prs" | jq -c '.[]' | while read -r pr; do
            number=$(echo "$pr" | jq -r '.number')
            created_at=$(echo "$pr" | jq -r '.createdAt')
            created_epoch=$(date -u -d "$created_at" +%s 2>/dev/null || date -u -jf "%Y-%m-%dT%H:%M:%SZ" "$created_at" +%s)
            on_hold=$(echo "$pr" | jq -r '[.labels[].name] | contains(["on-hold"])')

            echo "PR #$number: created $created_at, on_hold=$on_hold"

            if [ "$on_hold" = "true" ]; then
              echo "  skip: on-hold label present"
              continue
            fi

            if [ "$created_epoch" -gt "$three_days_ago" ]; then
              echo "  skip: younger than 3 days"
              continue
            fi

            changes_requested=$(gh pr view "$number" --repo "$REPO" \
              --json reviews -q '[.reviews[] | select(.state == "CHANGES_REQUESTED")] | length')
            if [ "$changes_requested" -gt 0 ]; then
              echo "  skip: has a changes-requested review"
              continue
            fi

            mergeable=$(gh pr view "$number" --repo "$REPO" --json mergeable -q .mergeable)
            checks_status=$(gh pr checks "$number" --repo "$REPO" --json state -q \
              '[.[] | select(.state != "SUCCESS" and .state != "SKIPPED" and .state != "NEUTRAL")] | length' 2>/dev/null || echo "1")

            if [ "$mergeable" != "MERGEABLE" ]; then
              echo "  skip: not mergeable ($mergeable)"
              continue
            fi
            if [ "$checks_status" != "0" ]; then
              echo "  skip: checks not all green"
              continue
            fi

            echo "  merging #$number"
            gh pr merge "$number" --repo "$REPO" --merge --delete-branch
          done
