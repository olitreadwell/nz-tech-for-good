name: Wayback archiver

# Weekly archive of every entry's website via the Wayback Machine Save Page
# Now endpoint. Writes results to data/archives.json and commits the file
# back to the branch it ran on (schedule runs execute on the default
# branch, so the script's --min-age-days default keeps re-archives to
# roughly one per entry per week).
on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    name: Archive entry websites
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create archives file if missing
        run: |
          if [ ! -f data/archives.json ]; then
            echo "{}" > data/archives.json
          fi

      - name: Run Wayback archiver
        run: python3 scripts/archive_wayback.py

      - name: Commit and push archives changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archives.json
          if git diff --cached --quiet; then
            echo "No archives changes to commit"
          else
            git commit -m "chore: archive entry websites via Wayback Machine"
            git pull --rebase
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
