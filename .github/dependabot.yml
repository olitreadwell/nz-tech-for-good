# Grouped so a normal run produces one PR per upgrade class instead of ten.
# Majors stay ungrouped and unmerged: scripts/dependabot-auto-merge.mjs only
# enables auto-merge for patch and minor bumps that are old enough to trust.
#
# Cron is the only interval that can express "about every two weeks".
# "0 4 */14 * *" fires on days 1, 15 and 29, so the gap is 12 to 17 days rather
# than exactly 14. The cronjob is read in the timezone below, so updates land at
# 04:00 Pacific/Auckland, inside the 03:00 to 06:00 window.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'cron'
      cronjob: '0 4 */14 * *'
      timezone: 'Pacific/Auckland'
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 5
    labels: ['dependencies']
    # Majors that cannot pass the local check gate stay held until the
    # upstream peer range widens. Each one below was verified by running
    # the repo's own `npm run check` against the bump.
    ignore:
      # typescript-eslint 8.7x peers typescript ">=4.8.4 <6.1.0"; a 7.x
      # typescript makes eslint abort before it lints a single file.
      - dependency-name: 'typescript'
        versions: ['>=7.0.0']
      # eslint-plugin-jsx-a11y 6.10.2 peers eslint "^3 || ... || ^9", so
      # eslint 10 crash-loops the react rules.
      - dependency-name: 'eslint'
        versions: ['>=10.0.0']
      - dependency-name: '@eslint/js'
        versions: ['>=10.0.0']
      # vitest and its coverage provider must move majors together, and
      # Dependabot cannot express that pairing in a group.
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/coverage-v8'
        update-types: ['version-update:semver-major']
    groups:
      production-patch:
        dependency-type: 'production'
        update-types: ['patch']
      production-minor:
        dependency-type: 'production'
        update-types: ['minor']
      development-patch:
        dependency-type: 'development'
        update-types: ['patch']
      development-minor:
        dependency-type: 'development'
        update-types: ['minor']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'cron'
      cronjob: '0 4 */14 * *'
      timezone: 'Pacific/Auckland'
    open-pull-requests-limit: 5
    labels: ['dependencies']
    groups:
      github-actions:
        patterns: ['*']
