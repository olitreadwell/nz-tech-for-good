name: Feature request
description: Propose a new feature or improvement.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that you cannot do today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it behave? Sketch the shape, not the implementation.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
