# Auto-label rules for PRs. When a PR changes files matching one
# of these globs, the named label is applied.

data:
  - changed-files:
    - any-glob-to-any-file: "data/entries/**"

scripts:
  - changed-files:
    - any-glob-to-any-file: "scripts/**"

docs:
  - changed-files:
    - any-glob-to-any-file: "docs/**"
    - any-glob-to-any-file: "GUIDE.md"

site:
  - changed-files:
    - any-glob-to-any-file: "site/**"

ci:
  - changed-files:
    - any-glob-to-any-file: ".github/**"

schema:
  - changed-files:
    - any-glob-to-any-file: "schema/**"

tests:
  - changed-files:
    - any-glob-to-any-file: "tests/**"
