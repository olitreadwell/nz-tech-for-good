<!doctype html>
<html lang="en-NZ">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NZ Tech-for-Good has moved</title>
    <link rel="canonical" href="https://nz-tech-for-good.vercel.app/" />
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <p>NZ Tech-for-Good has moved to <a href="https://nz-tech-for-good.vercel.app/">nz-tech-for-good.vercel.app</a>.</p>
    <script>
      var prefix = '/nz-tech-for-good';
      var path = location.pathname.indexOf(prefix) === 0 ? location.pathname.slice(prefix.length) : '/';
      location.replace('https://nz-tech-for-good.vercel.app' + path + location.search + location.hash);
    </script>
  </body>
</html>
